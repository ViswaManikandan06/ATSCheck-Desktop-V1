name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run focused backend regression tests
        run: >-
          python -m pytest -q
          backend/tests/test_health.py
          backend/tests/test_feature_flags.py
          backend/tests/test_resume_parser.py
          backend/tests/test_resume_api.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libayatana-appindicator3-dev libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev patchelf librsvg2-dev \
            xdg-utils
      - name: Install backend build dependencies
        run: python -m pip install -r backend/requirements-build.txt
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Build frontend and Python sidecar
        run: |
          npm run build
          npm run sidecar:build
        working-directory: frontend
      - name: Check native Tauri shell
        run: cargo check --manifest-path frontend/src-tauri/Cargo.toml
